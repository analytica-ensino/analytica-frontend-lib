nodeLinker: node-modules

yarnPath: .yarn/releases/yarn-4.13.0.cjs

# @tiptap/react pulls @tiptap/extension-floating-menu as an optional
# dependency but doesn't hand it the @floating-ui/dom peer it asks for.
packageExtensions:
  "@tiptap/react@*":
    dependencies:
      "@floating-ui/dom": "^1.0.0"
