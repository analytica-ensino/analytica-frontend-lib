name: Tests

on:
  workflow_call:
    inputs:
      cache-key:
        description: "Cache key for node_modules"
        required: true
        type: string

jobs:
  test:
    name: Run Tests with Coverage (80% minimum)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn

      - name: Restore node_modules cache
        uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            .yarn/cache
            .pnp.*
          key: ${{ inputs.cache-key }}
          fail-on-cache-miss: true

      - name: Run Tests with Coverage
        env:
          CI: true
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: yarn test

      # New-code coverage gate: at least 80% of the lines changed by the PR
      # must be covered. The global 80% floor is enforced by jest.
      - name: Check Coverage on Changed Lines (80% minimum)
        if: github.event_name == 'pull_request'
        run: |
          pipx run diff-cover==10.5.1 coverage/lcov.info \
            --compare-branch=origin/${{ github.base_ref }} \
            --fail-under=80
