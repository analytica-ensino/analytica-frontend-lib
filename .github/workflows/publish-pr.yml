name: Publish PR Version

on:
  workflow_call:
    inputs:
      cache-key:
        description: "Cache key for node_modules"
        required: true
        type: string

jobs:
  publish:
    name: Publish PR version to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      # Build the PR head, not the merge commit: the version is taken from the
      # head's package.json and carries the head's commit hash.
      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org/'
          cache: yarn

      - name: Restore node_modules cache
        uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            .yarn/cache
            .pnp.*
          key: ${{ inputs.cache-key }}
          fail-on-cache-miss: true

      # The cache is keyed on the merge commit's yarn.lock; this syncs it with
      # the head's lockfile (a no-op when they match).
      - name: Install dependencies
        run: yarn install --immutable

      - name: Set PR version
        id: version
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          BASE=$(node -p "require('./package.json').version")
          SHORT_SHA=${HEAD_SHA:0:7}
          # A semver prerelease identifier made only of digits can't start with
          # 0 (npm silently rewrites 0123456 as 123456). Extend the hash up to
          # its first letter so the identifier is never numeric.
          if [[ "$SHORT_SHA" =~ ^[0-9]+$ ]]; then
            SHORT_SHA=$(grep -oE '^[0-9]+[a-f]' <<< "$HEAD_SHA")
          fi
          VERSION="${BASE}-pr.${PR_NUMBER}.${SHORT_SHA}"
          npm version "$VERSION" --no-git-tag-version
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=pr-${PR_NUMBER}" >> "$GITHUB_OUTPUT"

      # --tag keeps "latest" on the main release; pr-<N> always points to the
      # newest build of the PR. npm publish runs prepack, which builds dist.
      - name: Publish package
        id: publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=8192
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # A re-run of the same commit finds its version already published.
          # Leave $TAG alone: re-running an older commit must not point it back
          # to an older build (and NPM_TOKEN can't change dist-tags anyway).
          if [ -n "$(npm view "analytica-frontend-lib@$VERSION" version 2>/dev/null)" ]; then
            echo "$VERSION is already published; nothing to do."
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            npm publish --access public --tag "$TAG"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      # One comment per new build; a re-run of the same commit doesn't repeat it.
      - name: Comment the version on the PR
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          BODY="$RUNNER_TEMP/pr-comment.md"
          {
            echo "📦 Versão publicada no npm: \`analytica-frontend-lib@$VERSION\` (commit $HEAD_SHA)"
            echo
            echo '```sh'
            echo "yarn add analytica-frontend-lib@$VERSION"
            echo '```'
            echo
            echo "O dist-tag \`$TAG\` sempre aponta para o build mais recente deste PR: \`yarn up analytica-frontend-lib@$TAG\`."
          } > "$BODY"
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -F body=@"$BODY" > /dev/null
          cat "$BODY" >> "$GITHUB_STEP_SUMMARY"
