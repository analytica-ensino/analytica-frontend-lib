name: Publish PR Version

on:
  workflow_call:
    inputs:
      cache-key:
        description: "Cache key for node_modules"
        required: true
        type: string

# PR versions go to GitHub Packages as @analytica-ensino/analytica-frontend-lib,
# never to npm (AE-3244): this workflow runs from the PR head, so whoever opens
# the PR controls it. The apps install a PR version through a yarn alias; see
# "Versões de PR" in the README.
env:
  PR_PACKAGE: '@analytica-ensino/analytica-frontend-lib'
  PR_REGISTRY: 'https://npm.pkg.github.com'

jobs:
  publish:
    name: Publish PR version to GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: write

    steps:
      # Build the PR head, not the merge commit: the version is taken from the
      # head's package.json and carries the head's commit hash.
      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: ${{ env.PR_REGISTRY }}
          scope: '@analytica-ensino'
          cache: yarn

      - name: Restore node_modules cache
        uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            .yarn/cache
            .pnp.*
          key: ${{ inputs.cache-key }}
          fail-on-cache-miss: true

      # The cache is keyed on the merge commit's yarn.lock; this syncs it with
      # the head's lockfile (a no-op when they match).
      - name: Install dependencies
        run: yarn install --immutable

      - name: Set PR version
        id: version
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          BASE=$(node -p "require('./package.json').version")
          SHORT_SHA=${HEAD_SHA:0:7}
          # A semver prerelease identifier made only of digits can't start with
          # 0 (npm silently rewrites 0123456 as 123456). Extend the hash up to
          # its first letter so the identifier is never numeric.
          if [[ "$SHORT_SHA" =~ ^[0-9]+$ ]]; then
            SHORT_SHA=$(grep -oE '^[0-9]+[a-f]' <<< "$HEAD_SHA")
          fi
          VERSION="${BASE}-pr.${PR_NUMBER}.${SHORT_SHA}"
          # GitHub Packages only takes packages scoped to the repo owner. The
          # registry is pinned too, so a missing scope mapping can't send the
          # package to npm.
          npm pkg set name="$PR_PACKAGE" publishConfig.registry="$PR_REGISTRY"
          npm version "$VERSION" --no-git-tag-version
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=pr-${PR_NUMBER}" >> "$GITHUB_OUTPUT"

      # pr-<N> always points to the newest build of the PR. npm publish runs
      # prepack, which builds dist.
      - name: Publish package
        id: publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=8192
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # A re-run of the same commit finds its version already published.
          # Leave $TAG alone: re-running an older commit must not point it back
          # to an older build.
          if [ -n "$(npm view "$PR_PACKAGE@$VERSION" version 2>/dev/null)" ]; then
            echo "$VERSION is already published; nothing to do."
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            npm publish --tag "$TAG"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      # One comment per new build; a re-run of the same commit doesn't repeat it.
      - name: Comment the version on the PR
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          BODY="$RUNNER_TEMP/pr-comment.md"
          README="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/main/README.md#vers%C3%B5es-de-pr"
          {
            echo "📦 Versão de teste publicada no GitHub Packages: \`$PR_PACKAGE@$VERSION\` (commit $HEAD_SHA)"
            echo
            echo '```sh'
            echo "yarn add analytica-frontend-lib@npm:$PR_PACKAGE@$VERSION"
            echo '```'
            echo
            echo "O dist-tag \`$TAG\` sempre aponta para o build mais recente deste PR: \`yarn up analytica-frontend-lib@npm:$PR_PACKAGE@$TAG\`."
            echo
            echo "Primeira vez? Configure o token do GitHub Packages seguindo o passo a passo em [Versões de PR]($README). Não commite essa versão no app."
          } > "$BODY"
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -F body=@"$BODY" > /dev/null
          cat "$BODY" >> "$GITHUB_STEP_SUMMARY"
