name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed

# One group per PR: a new commit, or closing/merging the PR, cancels the PR
# run still in progress. Push runs (deploys) get a unique group and are never
# cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The run fired by "closed" only cancels the previous one and removes the PR
  # dist-tag; skipping setup skips every job that needs it.
  setup:
    name: Setup Dependencies
    if: github.event.action != 'closed'
    uses: ./.github/workflows/setup.yml

  lint:
    name: Run Lint
    needs: setup
    uses: ./.github/workflows/lint.yml
    with:
      cache-key: ${{ needs.setup.outputs.cache-key }}

  typecheck:
    name: Run TypeCheck
    needs: setup
    uses: ./.github/workflows/typecheck.yml
    with:
      cache-key: ${{ needs.setup.outputs.cache-key }}

  test:
    name: Run Tests
    needs: [setup, lint, typecheck]
    uses: ./.github/workflows/test.yml
    with:
      cache-key: ${{ needs.setup.outputs.cache-key }}

  publish:
    name: Publish Package
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [setup, lint, typecheck]
    uses: ./.github/workflows/publish.yml
    with:
      cache-key: ${{ needs.setup.outputs.cache-key }}
    secrets: inherit
    permissions:
      contents: write
      id-token: write

  # Every PR commit publishes <package.json version>-pr.<N>.<short sha> under
  # the pr-<N> dist-tag and comments the version on the PR, so the apps can
  # try a change before it reaches main. PRs from forks have no NPM_TOKEN.
  publish-pr:
    name: Publish PR Version
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [setup, lint, typecheck]
    uses: ./.github/workflows/publish-pr.yml
    with:
      cache-key: ${{ needs.setup.outputs.cache-key }}
    secrets: inherit
    permissions:
      contents: read
      pull-requests: write

  untag-pr:
    name: Remove PR Dist-Tag
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/untag-pr.yml
    secrets: inherit
    permissions:
      contents: read

  deploy-ladle:
    name: Deploy Ladle
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [setup, lint, typecheck]
    uses: ./.github/workflows/ladle.yml
    with:
      cache-key: ${{ needs.setup.outputs.cache-key }}
    permissions:
      contents: read
      pages: write
      id-token: write
